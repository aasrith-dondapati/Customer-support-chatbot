<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: "Inter", sans-serif; }
        .chat-container { max-height: 70vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-lg">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">Customer Support Chatbot</h1>
        <div id="chatbox" class="chat-container border rounded-lg p-4 mb-4 bg-gray-50">
            <div class="flex justify-start mb-2">
                <div class="bg-blue-100 text-blue-800 p-3 rounded-lg max-w-xs break-words">Hello! How can I help you today?</div>
            </div>
        </div>
        <div class="flex">
            <input type="text" id="userInput" placeholder="Type your message..." class="flex-grow p-3 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-r-lg shadow-md">Send</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatbox = document.getElementById('chatbox');
            const userId = 'user_' + Math.random().toString(36).substr(2, 9); // Simple unique ID

            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            function addMessage(sender, message) {
                const messageElement = document.createElement('div');
                messageElement.className = `flex mb-2 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
                messageElement.innerHTML = `
                    <div class="${sender === 'user' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-800'} p-3 rounded-lg max-w-xs break-words">
                        ${message}
                    </div>
                `;
                chatbox.appendChild(messageElement);
                chatbox.scrollTop = chatbox.scrollHeight; // Scroll to bottom
            }

            async function sendMessage() {
                const message = userInput.value.trim();
                if (!message) return;

                addMessage('user', message);
                userInput.value = '';

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message: message, sender: userId }),
                    });

                    const data = await response.json();
                    if (data.response && data.response.length > 0) {
                        data.response.forEach(botMsg => {
                            addMessage('bot', botMsg);
                        });
                    } else {
                        addMessage('bot', "I'm sorry, I couldn't get a response from the bot.");
                    }
                } catch (error) {
                    console.error('Error sending message:', error);
                    addMessage('bot', "There was an error connecting to the chatbot. Please try again later.");
                }
            }
        });
    </script>
</body>
</html>
